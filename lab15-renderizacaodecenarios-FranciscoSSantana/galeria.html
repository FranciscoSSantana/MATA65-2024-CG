<!-- Atividade feita a partir do código do https://threejs.org/examples/?q=pointer#misc_controls_pointerlock
 	 para facilitação do uso do PointerLockControls. -->

<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Galeria de Arte</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			#blocker {
				position: absolute;
				width: 100%;
				height: 100%;
				background-color: rgba(0,0,0,0.5);
			}

			#instructions {
				width: 100%;
				height: 100%;

				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;

				text-align: center;
				font-size: 14px;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div id="blocker">
			<div id="instructions">
				<p style="font-size:36px; background-color:rgb(176, 167, 167)">
					Clique para Continuar
				</p>
				<p style="background-color: rgb(176, 167, 167);">
					Mover: WASD<br/>
					Pular: ESPAÇO<br/>
					Olhar: MOUSE<br/>
					Pausar: ESC<br/>
					Fullscreen: F11
				</p>
			</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three"         : "/Assets/scripts/three.js/build/three.module.js",
					"three/addons/"	: "/Assets/scripts/three.js/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
			import { RectAreaLightHelper } from 'three/addons/helpers/RectAreaLightHelper.js';

			let camera, scene, renderer, controls;

			const objects = [];

			let moveForward = false;
			let moveBackward = false;
			let moveLeft = false;
			let moveRight = false;
			let canJump = false;
			let altura = 1.0;

			let prevTime = performance.now();
			const velocity = new THREE.Vector3();
			const direction = new THREE.Vector3();

			init();

			function init() {

				camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 100 );
				//spawn
				camera.position.x = 1.65;
				camera.position.y = altura;
				camera.position.z = 1;
				camera.lookAt(0, altura, 1);

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xDEFEFF ); //céu azul

				controls = new PointerLockControls( camera, document.body );

				const blocker = document.getElementById( 'blocker' );
				const instructions = document.getElementById( 'instructions' );

				//Instruções para tomar controle do mouse
				instructions.addEventListener( 'click', function () {

					controls.lock();

				} );

				controls.addEventListener( 'lock', function () {

					instructions.style.display = 'none';
					blocker.style.display = 'none';

				} );

				controls.addEventListener( 'unlock', function () {

					blocker.style.display = 'block';
					instructions.style.display = '';

				} );

				scene.add( camera );

				//Input Catcher
				const onKeyDown = function ( event ) {

					switch ( event.code ) {

						case 'ArrowUp':
						case 'KeyW':
							moveForward = true;
							break;

						case 'ArrowLeft':
						case 'KeyA':
							moveLeft = true;
							break;

						case 'ArrowDown':
						case 'KeyS':
							moveBackward = true;
							break;

						case 'ArrowRight':
						case 'KeyD':
							moveRight = true;
							break;

						case 'Space':
							if ( canJump === true ) velocity.y += 10;
							canJump = false;
							break;

					}

				};

				const onKeyUp = function ( event ) {

					switch ( event.code ) {

						case 'ArrowUp':
						case 'KeyW':
							moveForward = false;
							break;

						case 'ArrowLeft':
						case 'KeyA':
							moveLeft = false;
							break;

						case 'ArrowDown':
						case 'KeyS':
							moveBackward = false;
							break;

						case 'ArrowRight':
						case 'KeyD':
							moveRight = false;
							break;

					}

				};

				document.addEventListener( 'keydown', onKeyDown );
				document.addEventListener( 'keyup', onKeyUp );

				//

				//Load de Objetos

				//Galeria
				const gltfLoader = new GLTFLoader();
				let url = '/Models/galeria/scene.gltf';
				gltfLoader.load(url, (gltf) => {
					const root = gltf.scene;
					root.position.set(0, 0.005, 0);
					root.scale.set(0.7, 0.7, 0.7);
					root.traverse( function( node ) {

					if ( node.isMesh ) { 
						node.castShadow = true; 
						node.receiveShadow = true;
					}

					} );
					scene.add(root);
				})
				
				//Escultura Metálica (Triple Mobius Strip)
				url = '/Models/esculturaMetal/scene.gltf';
				gltfLoader.load(url, (gltf) => {
					const root = gltf.scene;
					root.position.set(1.2, 1.04, 4.525);
					root.scale.set(0.12, 0.12, 0.12);
					root.rotateY(Math.PI/20);
					root.traverse( function( node ) {

					if ( node.isMesh ) { node.castShadow = true; node.receiveShadow = true; }

					} );
					scene.add(root);
				})

				//Pedestal da Escultura Metálica
				const geometry = new THREE.BoxGeometry( 0.6, 1, 1 ); 
				const material = new THREE.MeshPhongMaterial( ); 
				const pedestal = new THREE.Mesh( geometry, material ); 
				pedestal.position.set(1.2, 0.24, 4.525)
				pedestal.castShadow = true;
				pedestal.receiveShadow = true;
				scene.add( pedestal );

				//Escultura de Pedra (Dragão)
				url = '/Models/esculturaPedra/scene.gltf';
				gltfLoader.load(url, (gltf) => {
					const root = gltf.scene;
					root.position.set(-1, 0, -4);
					root.scale.set(0.1, 0.1, 0.1);
					root.rotateY(Math.PI/-1.9);
					root.traverse( function( node ) {

					if ( node.isMesh ) { node.castShadow = true; node.receiveShadow = true; }

					} );
					scene.add(root);
				})

				//Escultura de Madeira (Pato)
				url = '/Models/esculturaMadeira/scene.gltf';
				gltfLoader.load(url, (gltf) => {
					const root = gltf.scene;
					root.position.set(-1.2, 0.7, 7.2);
					root.scale.set(0.03, 0.03, 0.03);
					root.rotateY(Math.PI);
					root.traverse( function( node ) {

					if ( node.isMesh ) { node.castShadow = true; node.receiveShadow = true; }

					} );
					scene.add(root);
				})

				//Pedestal da Escultura de Madeira
				const geometry2 = new THREE.BoxGeometry( 0.6, 0.7, 1 );
				const pedestal2 = new THREE.Mesh( geometry2, material ); 
				pedestal2.position.set(-1.2, 0.35, 7.2)
				pedestal2.castShadow = true;
				pedestal2.receiveShadow = true;
				scene.add( pedestal2 );

				//Retrato Vitoriano
				url = '/Models/pintura1/scene.gltf';
				gltfLoader.load(url, (gltf) => {
					const root = gltf.scene;
					root.position.set(-1.48, 1.25, -8.65);
					root.scale.set(0.5, 0.5, 0.5);
					scene.add(root);
				})

				//Foto de Casal
				url = '/Models/pintura2/scene.gltf';
				gltfLoader.load(url, (gltf) => {
					const root = gltf.scene;
					root.position.set(-1.48, 1.25, 2.3);
					root.scale.set(0.008, 0.008, 0.008);
					root.rotateY(Math.PI/-2);
					scene.add(root);
				})

				//Foto de Paisagem
				url = '/Models/pintura3/scene.gltf';
				gltfLoader.load(url, (gltf) => {
					const root = gltf.scene;
					root.position.set(-1.48, 1.25, -0.1);
					root.scale.set(0.8, 0.8, 0.8);
					root.rotateY(Math.PI/2);
					scene.add(root);
				})

				//
				//Luzes
				
				//Directional ("sol") e Ambiente
				const light = new THREE.DirectionalLight(0xFFFFFF, 2.5);
				light.position.set(6, 5, 0);
				light.target.position.set(0, 0, 0);

				scene.add(light);
				scene.add(light.target);

				const amblight = new THREE.AmbientLight( 0x404040, 1 ); // soft white light
				scene.add( amblight );
				
				
				//Spotlight da escultura metálica
				const spotlight = new THREE.SpotLight(0xFFFFFF, 10);
				spotlight.castShadow = true;
				spotlight.angle = Math.PI/15;
				spotlight.penumbra = 0.1;
				spotlight.position.set(-1.5, 2.4, 4.525);
				spotlight.target.position.set(1.1, 1.025, 4.525);

				spotlight.shadow.bias = 0.002;
				spotlight.shadow.mapSize.width = 512;
				spotlight.shadow.mapSize.height = 512;

				let shadowCam = spotlight.shadow.camera;
				shadowCam.fov = 10;
				shadowCam.near = 1;
				shadowCam.far = 8;
				shadowCam.left = -1;
				shadowCam.right = 1;
				shadowCam.top = 2;
				shadowCam.bottom = -4;

				scene.add(spotlight);
				scene.add(spotlight.target);

				//const cameraspotHelper = new THREE.CameraHelper(spotlight.shadow.camera);
				//scene.add(cameraspotHelper);
				

				//Spotlight da Escultura de Pedra
				const spotlight2 = new THREE.SpotLight(0xFFFFFF, 10);
				spotlight2.castShadow = true;
				spotlight2.angle = Math.PI/9;
				spotlight2.penumbra = 0.1;
				spotlight2.position.set(1.8, 0.2, -3.95);
				spotlight2.target.position.set(-1, 0.5, -4.1);
				
				spotlight2.shadow.bias = -0.004;
				spotlight2.shadow.mapSize.width = 512;
				spotlight2.shadow.mapSize.height = 512;

				shadowCam = spotlight2.shadow.camera;
				shadowCam.fov = 15;
				shadowCam.near = 1;
				shadowCam.far = 5;
				shadowCam.left = -2;
				shadowCam.right = 2;
				shadowCam.top = 2;
				shadowCam.bottom = -2;

				scene.add(spotlight2);
				scene.add(spotlight2.target);

				//const cameraspotHelper2 = new THREE.CameraHelper(spotlight2.shadow.camera);
				//scene.add(cameraspotHelper2);


				//Spotlight da Escultura de Madeira
				const spotlight3 = new THREE.SpotLight(0xFFFFFF, 10);
				spotlight3.castShadow = true;
				spotlight3.angle = Math.PI/9;
				spotlight3.penumbra = 0.1;
				spotlight3.position.set(1.2, 1.1, 7.9);
				spotlight3.target.position.set(-1.2, 1, 7.2);
				
				spotlight3.shadow.bias = -0.004;
				spotlight3.shadow.mapSize.width = 512;
				spotlight3.shadow.mapSize.height = 512;

				shadowCam = spotlight3.shadow.camera;
				shadowCam.fov = 15;
				shadowCam.near = 1;
				shadowCam.far = 5;
				shadowCam.left = 0;
				shadowCam.right = 2;
				shadowCam.top = 2;
				shadowCam.bottom = -2;

				scene.add(spotlight3);
				scene.add(spotlight3.target);

				//const cameraspotHelper3 = new THREE.CameraHelper(spotlight3.shadow.camera);
				//scene.add(cameraspotHelper3);


				//Spotlight do Retrato Vitoriano
				const spotlight4 = new THREE.SpotLight(0xFFFFFF, 10);
				spotlight4.angle = Math.PI/15;
				spotlight4.penumbra = 0.1;
				spotlight4.position.set(1.1, 2.3, -8.65);
				spotlight4.target.position.set(-1.48, 1.25, -8.65);

				scene.add(spotlight4);
				scene.add(spotlight4.target);


				//Spotlight da foto de casal
				const spotlight5 = new THREE.SpotLight(0xFFFFFF, 10);
				spotlight5.angle = Math.PI/15;
				spotlight5.penumbra = 0.1;
				spotlight5.position.set(1.1, 2.2, 2.3);
				spotlight5.target.position.set(-1.48, 1.25, 2.3);

				scene.add(spotlight5);
				scene.add(spotlight5.target);

				//Spotlight da foto de paisagem
				const spotlight6 = new THREE.SpotLight(0xFFFFFF, 10);
				spotlight6.angle = Math.PI/11;
				spotlight6.penumbra = 0.1;
				spotlight6.position.set(1.1, 2.2, -0.1);
				spotlight6.target.position.set(-1.48, 1.25, -0.1);

				scene.add(spotlight6);
				scene.add(spotlight6.target);

				
				//Iluminações das portas	
				RectAreaLightUniformsLib.init();

				const rectLight1 = new THREE.RectAreaLight( 0xffffff, 1, 4, 2.5 );
				rectLight1.position.set( 0, 1, 9.68 );
				rectLight1.lookAt(0, 1, 9);
				scene.add( rectLight1 );

				const rectLight2 = new THREE.RectAreaLight( 0xffffff, 1, 2, 2.4 );
				rectLight2.position.set( 2, 1, -8.67 );
				rectLight2.lookAt(1.9, 1, -8.67);
				scene.add( rectLight2 );
				
				
				//Chão Exterior (Placeholder)
				const groundSize 	= 20.0;
				const txtLoader 	= new THREE.TextureLoader();
				const texture 		= txtLoader.load("/Assets/Textures/checker.png");
				texture.wrapS 		= THREE.RepeatWrapping;
				texture.wrapT 		= THREE.RepeatWrapping;
				texture.magFilter 	= THREE.NearestFilter;

				texture.repeat.set(groundSize / 2, groundSize / 2);

				const groundMesh 			= new THREE.Mesh(	new THREE.PlaneGeometry(20.0, 20.0), 
																new THREE.MeshStandardMaterial( { 	map 	:   texture,
																									side 	:   THREE.DoubleSide, 
																								})
															);
				groundMesh.rotation.x 		= Math.PI * -.5;
				groundMesh.castShadow 		= false;
				groundMesh.receiveShadow 	= true;
				scene.add(groundMesh);
				
				//Renderer
				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.shadowMap.enabled = true;
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				const time = performance.now();

				//Controle da Movimentação
				if ( controls.isLocked === true ) {

					const delta = ( time - prevTime ) / 1000;

					velocity.x -= velocity.x * 10.0 * delta;
					velocity.z -= velocity.z * 10.0 * delta;

					velocity.y -= 9.8 * 5.0 * delta;

					direction.z = Number( moveForward ) - Number( moveBackward );
					direction.x = Number( moveRight ) - Number( moveLeft );
					direction.normalize(); // this ensures consistent movements in all directions

					if ( moveForward || moveBackward ) velocity.z -= direction.z * 30.0 * delta;
					if ( moveLeft || moveRight ) velocity.x -= direction.x * 30.0 * delta;

					controls.moveRight( - velocity.x * delta );
					controls.moveForward( - velocity.z * delta );

					camera.position.y += ( velocity.y * delta );

					if ( camera.position.y < altura ) {

						velocity.y = 0;
						camera.position.y = altura;

						canJump = true;

					}

				}

				prevTime = time;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
